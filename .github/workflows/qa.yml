name: QA

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # nightly: full suite incl. reliability
  workflow_dispatch:

jobs:
  api-and-security:
    name: API + security (release blockers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright test --project=api

  ai-eval:
    name: AI evaluation (golden dataset + behavior)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright test --project=ai-eval

  e2e:
    name: Critical E2E flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-report, path: playwright-report, retention-days: 7 }

  suite-catches-bugs:
    name: Suite catches known defects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run test:bugs

  reliability:
    name: Reliability (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright test --project=reliability
        env: { RELIABILITY_RUNS: '500' }
