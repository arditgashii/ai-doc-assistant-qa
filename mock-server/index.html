<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Doc Assistant (mock)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
  section { border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  input, textarea, button { font: inherit; padding: .5rem; margin: .25rem 0; }
  textarea { width: 100%; box-sizing: border-box; }
  .answer { white-space: pre-wrap; background: #f6f8fa; padding: .75rem; border-radius: 6px; }
  .error { color: #cf222e; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Doc Assistant</h1>

<section id="login">
  <h2>Sign in</h2>
  <label>Username <input id="username" autocomplete="username" /></label><br />
  <label>Password <input id="password" type="password" autocomplete="current-password" /></label><br />
  <button id="signin">Sign in</button>
  <p id="login-error" class="error" role="alert"></p>
</section>

<section id="app" hidden>
  <p>Signed in as <strong id="who"></strong></p>
  <h2>Upload</h2>
  <input id="file" type="file" accept=".pdf,.docx" aria-label="Choose document" />
  <p id="upload-status" role="status"></p>

  <h2>Ask</h2>
  <textarea id="question" rows="3" aria-label="Question" placeholder="Ask about your documents"></textarea>
  <button id="ask">Ask</button>
  <p id="loading" role="status" hidden>Thinking...</p>
  <div id="answer" class="answer" aria-live="polite" hidden></div>
  <p id="ask-error" class="error" role="alert"></p>
</section>

<script>
  let token = null;
  const $ = (id) => document.getElementById(id);
  const api = async (path, body) => {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({ error: { message: 'Unexpected server response.' } }));
    return { ok: res.ok, status: res.status, data };
  };

  $('signin').onclick = async () => {
    const r = await api('/api/login', { username: $('username').value, password: $('password').value });
    if (!r.ok) return ($('login-error').textContent = r.data.error.message);
    token = r.data.token;
    $('who').textContent = r.data.username;
    $('login').hidden = true;
    $('app').hidden = false;
  };

  $('file').onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const buf = new Uint8Array(await f.arrayBuffer());
    let bin = '';
    buf.forEach((b) => (bin += String.fromCharCode(b)));
    $('upload-status').textContent = 'Uploading...';
    const r = await api('/api/documents', { name: f.name, contentBase64: btoa(bin) });
    $('upload-status').textContent = r.ok ? `Uploaded ${r.data.name}` : r.data.error.message;
  };

  $('ask').onclick = async () => {
    $('ask-error').textContent = '';
    $('answer').hidden = true;
    $('ask').disabled = true;
    $('loading').hidden = false;
    try {
      const r = await api('/api/questions', { question: $('question').value });
      if (!r.ok) return ($('ask-error').textContent = r.data.error.message);
      $('answer').textContent = r.data.answer;
      $('answer').hidden = false;
    } finally {
      $('ask').disabled = false;
      $('loading').hidden = true;
    }
  };
</script>
</body>
</html>
